<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokyo Vape Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            opacity: 0.9;
            font-size: 16px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 22px;
        }
        
        .brands-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .brand-card {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .brand-card:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            background: rgba(102,126,234,0.1);
        }
        
        .brand-emoji {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .brand-name {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 5px;
        }
        
        .brand-count {
            color: #aaa;
            font-size: 14px;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        
        .product-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            border-left: 4px solid #667eea;
        }
        
        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .product-taste {
            font-weight: bold;
            font-size: 18px;
        }
        
        .product-status {
            font-size: 24px;
        }
        
        .product-details {
            display: flex;
            justify-content: space-between;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .product-price {
            color: #667eea;
            font-weight: bold;
            font-size: 20px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        
        .back-btn {
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .back-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .info-box {
            background: rgba(102,126,234,0.1);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
            border-left: 4px solid #667eea;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: #888;
        }
        
        @media (max-width: 600px) {
            .brands-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <h1>🚀 TOKYO VAPE SHOP</h1>
            <p class="subtitle">Актуальные остатки • Быстрый заказ</p>
        </div>
        
        <!-- Загрузка -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Загружаем каталог...</p>
        </div>
        
        <!-- Бренды -->
        <div id="brands-section" class="section" style="display: none;">
            <h2>🏷️ ВЫБЕРИ БРЕНД</h2>
            <div id="brands-list" class="brands-grid"></div>
        </div>
        
        <!-- Товары -->
        <div id="products-section" class="section" style="display: none;">
            <button class="btn back-btn" onclick="showBrands()">◀️ Назад</button>
            <h2 id="brand-title"></h2>
            <div id="products-list" class="products-grid"></div>
        </div>
        
        <!-- Информация -->
        <div class="info-box">
            <p><strong>📞 Заказ:</strong> Нажмите на кнопку "Заказать" под товаром</p>
            <p><strong>🔄 Обновлено:</strong> <span id="update-time">секунду назад</span></p>
            <p><strong>👤 Менеджер:</strong> @arcsize</p>
        </div>
        
        <!-- Подвал -->
        <div class="footer">
            <p>© 2026 Tokyo Vape Shop • Все цены в рублях</p>
            <button class="btn" onclick="loadData()">🔄 Обновить каталог</button>
        </div>
    </div>

    <script>
        // Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // На весь экран
        tg.setHeaderColor('#667eea');
        tg.setBackgroundColor('#0f0f23');
        
        // Данные
        let productsData = [];
        let currentBrand = '';
        
        // Эмодзи для брендов
        const brandEmojis = {
            'ЗЛАЯ МОНАШКА': '😈',
            'ANIMMA': '🔥',
            'CATSWILL': '😼',
            'DOTA': '🎮',
            'PODONKI': '👅',
            'САМОУБИЙЦА': '💀',
            'VAPORESSO': '🔋',
            'RICK AND MORTY': '👽'
        };
        
        // Эмодзи для вкусов
        const tasteEmojis = {
            'ВИШНЯ': '🍒', 'АРБУЗ': '🍉', 'МАЛИНА': '🫐',
            'КЛУБНИКА': '🍓', 'АНАНАС': '🍍', 'ВИНОГРАД': '🍇',
            'ГРАНАТ': '🧃', 'ДЫНЯ': '🍈', 'ПЕРСИК': '🍑',
            'ГРЕЙПФРУТ': '🍊', 'ЛЕМОН': '🍋', 'КЛЮКВА': '🫐'
        };
        
        // Загрузка данных
        async function loadData() {
            try {
                showLoading();
                
                // Загрузка из data.json
                const response = await fetch('data.json?v=' + Date.now());
                const data = await response.json();
                
                productsData = data.products || [];
                
                // Если нет данных, используем тестовые
                if (!productsData.length) {
                    productsData = getTestData();
                }
                
                updateTime();
                showBrands();
                
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                
                // Используем тестовые данные при ошибке
                productsData = getTestData();
                updateTime();
                showBrands();
            }
        }
        
        // Тестовые данные (если data.json не загрузился)
        function getTestData() {
            return [
                {
                    brand: 'ЗЛАЯ МОНАШКА ICE',
                    taste: 'ВИШНЯ ЛЁД',
                    price: '400',
                    strength: '50MG',
                    stock: 15
                },
                {
                    brand: 'ЗЛАЯ МОНАШКА ICE',
                    taste: 'АНАНАС ГРАНАТ ЛЁД',
                    price: '400',
                    strength: '50MG',
                    stock: 8
                },
                {
                    brand: 'ANIMMA',
                    taste: 'ПАСИФИК ВИШНЯ АЙС',
                    price: '450',
                    strength: '70MG',
                    stock: 10
                }
            ];
        }
        
        // Показать загрузку
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('brands-section').style.display = 'none';
            document.getElementById('products-section').style.display = 'none';
        }
        
        // Показать бренды
        function showBrands() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('brands-section').style.display = 'block';
            document.getElementById('products-section').style.display = 'none';
            
            // Группируем по брендам
            const brands = {};
            productsData.forEach(product => {
                if (!brands[product.brand]) {
                    brands[product.brand] = [];
                }
                brands[product.brand].push(product);
            });
            
            // Создаем список брендов
            const brandsList = document.getElementById('brands-list');
            brandsList.innerHTML = '';
            
            Object.entries(brands).forEach(([brandName, items]) => {
                const emoji = brandEmojis[brandName] || '🏷️';
                
                const brandCard = document.createElement('div');
                brandCard.className = 'brand-card';
                brandCard.innerHTML = `
                    <div class="brand-emoji">${emoji}</div>
                    <div class="brand-name">${brandName}</div>
                    <div class="brand-count">${items.length} вкусов</div>
                `;
                
                brandCard.onclick = () => showProducts(brandName);
                brandsList.appendChild(brandCard);
            });
        }
        
        // Показать товары бренда
        function showProducts(brandName) {
            currentBrand = brandName;
            
            document.getElementById('brands-section').style.display = 'none';
            document.getElementById('products-section').style.display = 'block';
            
            document.getElementById('brand-title').textContent = 
                `${brandEmojis[brandName] || '🏷️'} ${brandName}`;
            
            const brandProducts = productsData.filter(p => p.brand === brandName);
            const productsList = document.getElementById('products-list');
            productsList.innerHTML = '';
            
            brandProducts.forEach(product => {
                // Эмодзи для вкуса
                let tasteEmoji = '🍃';
                for (const [key, emoji] of Object.entries(tasteEmojis)) {
                    if (product.taste.includes(key)) {
                        tasteEmoji = emoji;
                        break;
                    }
                }
                
                // Статус наличия
                let status = '💫';
                if (product.stock <= 2) status = '🟡';
                else if (product.stock <= 5) status = '🟢';
                
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.innerHTML = `
                    <div class="product-header">
                        <div class="product-taste">${tasteEmoji} ${product.taste}</div>
                        <div class="product-status">${status}</div>
                    </div>
                    <div class="product-details">
                        <span>⚡ ${product.strength}</span>
                        <span>📦 ${product.stock} шт.</span>
                    </div>
                    <div class="product-price">${product.price} ₽</div>
                    <button class="btn" onclick="orderProduct('${product.taste}', '${product.brand}', ${product.price})">
                        🛒 Заказать
                    </button>
                `;
                
                productsList.appendChild(productCard);
            });
        }
        
        // Заказ товара
        function orderProduct(taste, brand, price) {
            const message = `Заказ: ${brand} - ${taste} (${price}₽)`;
            
            // Открываем чат с менеджером
            if (tg.platform !== 'unknown') {
                tg.openTelegramLink(`https://t.me/arcsize?text=${encodeURIComponent(message)}`);
            } else {
                // Для теста в браузере
                window.open(`https://t.me/arcsize?text=${encodeURIComponent(message)}`, '_blank');
            }
        }
        
        // Обновить время
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ru-RU', {
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('update-time').textContent = timeStr;
        }
        
        // Загружаем данные при старте
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
